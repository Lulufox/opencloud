name: Build and Push Docker Image

on:
  push:
    branches: [ themes ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate assets
      run: |
        echo "Generating assets"
        make generate

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/iliadacloud:latest
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iliadacloud:latest
        cache-to: type=inline

    - name: Verify push
      run: |
        echo "Docker image successfully built and pushed to Docker Hub"
        echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/iliadacloud:latest"

  send_message:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
    - name: send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        format: markdown
        message: |
          *${{ github.workflow }}*

          New image pushed to Dockerhub 🐳
